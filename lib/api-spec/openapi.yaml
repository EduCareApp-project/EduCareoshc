openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Education & Care Management Portal API
servers:
  - url: /api
tags:
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: ai-tools
    description: Staff productivity tools powered by document processing.
  - name: health
  - name: children
  - name: staff
  - name: observations
  - name: outcomes
  - name: programs
  - name: nqs
  - name: dashboard
  - name: notices
  - name: jottings
  - name: incidents
  - name: condition-reports
  - name: evacuations
  - name: qip
  - name: wellbeing
  - name: policies
  - name: checklists
  - name: posts
  - name: professional-development
  - name: planning
  - name: reports
  - name: sites
  - name: notifications
  - name: notification-settings
  - name: medications
  - name: clickup
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List all enrolled children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Child"
    post:
      operationId: createChild
      tags: [children]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"

  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Not found
    patch:
      operationId: updateChild
      tags: [children]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
    delete:
      operationId: deleteChild
      tags: [children]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /children/{id}/medical-plans/print:
    get:
      operationId: getChildMedicalPlansPrint
      tags: [children]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff-authorized medical plan print data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalPlansPrintData"
        "403":
          description: Staff access required
        "404":
          description: Not found

  /children/{id}/observations:
    get:
